<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CS2 Bet</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    height:100%; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:#2a231b; color:#f0e6d2; user-select:none;
  }

  :root {
    --bg:      #2a231b;
    --bg2:     #352c22;
    --bg3:     #42382a;
    --border:  #5c4d38;
    --border2: #7a6850;
    --sand:    #d9c49a;
    --text:    #f0e6d2;
    --text2:   #b8a888;
    --text3:   #8a7754;
    --accent:  #d46b4a;
    --gold:    #e0b84a;
    --gold2:   #ffd966;
    --ct:      #4a6b8a;
    --green:   #6fbf4a;
  }

  #bg {
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 90% 60% at 50% 0%, rgba(217,196,154,0.1), transparent),
      radial-gradient(ellipse 60% 40% at 20% 100%, rgba(212,107,74,0.06), transparent),
      linear-gradient(180deg, #2a231b 0%, #352c22 100%);
  }

  .sand-dot {
    position:absolute; width:1px; height:1px; background:var(--sand); border-radius:50%;
    opacity:.2; animation:sandFloat 20s infinite linear;
  }
  @keyframes sandFloat {
    0%   { transform:translate(0, 0); opacity:0; }
    10%  { opacity:.3; }
    90%  { opacity:.3; }
    100% { transform:translate(30px, -40px); opacity:0; }
  }

  .decor-crates {
    position:fixed; bottom:0; left:0; right:0; height:70px;
    display:flex; justify-content:space-around; align-items:flex-end;
    padding:0 8px; pointer-events:none; z-index:0; opacity:0.35;
  }
  .crate {
    width:55px; height:45px;
    background:linear-gradient(180deg, #4a3d28, #2a231b);
    border:1px solid #5c4d38;
    position:relative;
  }
  .crate::before {
    content:""; position:absolute; inset:5px;
    border:1px solid #7a6850;
  }
  .crate.small { width:36px; height:32px; }

  .screen {
    position:fixed; inset:0; display:flex; flex-direction:column;
    z-index:1; transition:opacity .25s; background:transparent;
  }
  .screen.hidden { opacity:0; pointer-events:none; }

  .ico {
    display:inline-block; width:1em; height:1em; vertical-align:-0.12em;
    flex-shrink:0; line-height:1;
  }
  .ico svg { width:100%; height:100%; display:block; }

  /* Меню */
  #menu { align-items:center; justify-content:center; padding:28px; text-align:center; position:relative; z-index:2; }
  .brand {
    font-size:12px; color:var(--text3); letter-spacing:8px; text-transform:uppercase;
    margin-bottom:36px; font-weight:600;
  }
  .brand span { color:var(--accent); }
  .balance-block { margin-bottom:36px; }
  .balance-label {
    font-size:10px; color:var(--text3); letter-spacing:4px; text-transform:uppercase;
    margin-bottom:10px;
  }
  .balance-value {
    font-size:52px; font-weight:200; letter-spacing:-2px;
    color:var(--gold2); font-variant-numeric:tabular-nums;
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .balance-value .ico { font-size:36px; color:var(--gold2); opacity:.9; }

  .modes { display:flex; flex-direction:column; gap:12px; width:100%; max-width:320px; }
  .mode-btn {
    border:1px solid var(--border2); background:linear-gradient(180deg, var(--bg3), var(--bg2));
    border-radius:12px;
    padding:20px 24px; color:var(--text); cursor:pointer;
    display:flex; justify-content:space-between; align-items:center;
    transition:border-color .2s, box-shadow .2s;
    font-family:inherit; font-size:15px; letter-spacing:1px;
    position:relative; overflow:hidden;
  }
  .mode-btn::before {
    content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:linear-gradient(180deg, var(--accent), var(--gold));
    opacity:.6;
  }
  .mode-btn:active { border-color:var(--accent); }
  .mode-btn .label { font-weight:600; color:var(--sand); position:relative; }
  .mode-btn .sub { color:var(--text3); font-size:11px; margin-top:4px; letter-spacing:0; position:relative; }
  .mode-btn .arrow { color:var(--text3); font-size:18px; position:relative; }

  .menu-footer { margin-top:32px; display:flex; gap:10px; }
  .mini-btn {
    background:transparent; border:1px solid var(--border); color:var(--text3);
    font-size:12px; letter-spacing:1.5px; cursor:pointer;
    font-family:inherit; padding:12px 22px; border-radius:8px;
  }
  .mini-btn:active { border-color:var(--border2); color:var(--text2); }

  .topbar {
    padding:16px 20px; display:flex; justify-content:space-between; align-items:center;
    border-bottom:1px solid var(--border); position:relative; z-index:2;
  }
  .close-btn {
    background:transparent; border:none; color:var(--text3);
    cursor:pointer; padding:8px; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  .close-btn:active { color:var(--accent); }
  .close-btn .ico { font-size:20px; }
  .topbar-balance {
    color:var(--gold2); font-size:15px; font-variant-numeric:tabular-nums;
    display:flex; align-items:center; gap:6px; font-weight:300;
  }
  .topbar-balance .ico { font-size:14px; color:var(--gold2); }

  /* Кейсы */
  .cases-list {
    flex:1; padding:16px 20px; display:flex; flex-direction:column;
    gap:10px; overflow-y:auto; position:relative; z-index:2;
  }
  .case-item {
    border:1px solid var(--border2); background:linear-gradient(180deg, var(--bg3), var(--bg2));
    border-radius:10px;
    padding:18px 20px; color:var(--text); cursor:pointer;
    display:flex; justify-content:space-between; align-items:center;
    transition:border-color .2s; font-family:inherit; text-align:left;
    position:relative; overflow:hidden;
  }
  .case-item::before {
    content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:linear-gradient(180deg, var(--sand), var(--accent));
    opacity:0.7;
  }
  .case-item:active { border-color:var(--accent); }
  .case-item .info .name { font-size:15px; letter-spacing:1px; font-weight:600; color:var(--sand); }
  .case-item .info .range { color:var(--text3); font-size:11px; margin-top:4px; }
  .case-item .price {
    font-size:15px; color:var(--gold2); font-variant-numeric:tabular-nums;
    display:flex; align-items:center; gap:5px; flex-shrink:0;
  }
  .case-item .price .ico { font-size:14px; }
  .case-item.case-sub { border-color:var(--green); }

  /* Рулетка */
  .roulette-stage {
    flex:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    position:relative; overflow:hidden; z-index:2;
  }
  .roulette { position:relative; width:100%; height:120px; overflow:hidden; }
  .roulette::before, .roulette::after {
    content:""; position:absolute; top:0; bottom:0; width:70px; z-index:4;
    pointer-events:none;
  }
  .roulette::before { left:0; background:linear-gradient(to right, var(--bg) 20%, transparent); }
  .roulette::after { right:0; background:linear-gradient(to left, var(--bg) 20%, transparent); }

  .track {
    position:absolute; top:0; left:0; height:100%;
    display:flex; align-items:center; will-change:transform;
  }
  .slot {
    width:100px; height:110px; margin:0 4px; flex-shrink:0;
    border:1px solid var(--border); border-radius:8px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    background:linear-gradient(180deg, var(--bg3), var(--bg2));
    overflow:hidden; padding:6px;
  }
  .slot .slot-img {
    width:70px; height:45px; display:flex; align-items:center; justify-content:center;
  }
  .slot .slot-img svg { width:100%; height:100%; }
  .slot .slot-name {
    font-size:8px; text-align:center;
    line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    max-width:90px;
  }
  .slot .slot-wear { font-size:7px; opacity:.6; }

  .slot.common    { border-color:#6b5f48; color:#a89678; }
  .slot.common .slot-img { color:#a89678; }
  .slot.uncommon  { border-color:var(--ct); color:#7a9ab8; }
  .slot.uncommon .slot-img { color:#7a9ab8; }
  .slot.rare      { border-color:#8a5a9a; color:#b070c0; }
  .slot.rare .slot-img { color:#b070c0; }
  .slot.mythical  { border-color:var(--accent); color:var(--accent); }
  .slot.mythical .slot-img { color:var(--accent); }
  .slot.legendary { border-color:var(--gold); color:var(--gold2); }
  .slot.legendary .slot-img { color:var(--gold2); }

  .pointer {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:2px; height:130px; background:var(--accent); z-index:5;
    border-radius:1px;
  }

  .spin-result {
    text-align:center; margin-top:20px;
    opacity:0; transition:opacity .3s;
  }
  .spin-result.show { opacity:1; }
  .spin-result .label {
    font-size:9px; color:var(--text3); letter-spacing:4px; text-transform:uppercase;
    margin-bottom:8px;
  }
  .spin-result .val {
    font-size:34px; font-weight:200;
    color:var(--gold2); font-variant-numeric:tabular-nums;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }

  .spin-controls { padding:0 20px 20px; position:relative; z-index:2; }

  .main-btn {
    width:100%; background:linear-gradient(180deg, var(--bg3), var(--bg2)); border:1px solid var(--accent);
    border-radius:10px; padding:18px; color:var(--sand);
    font-size:14px; font-weight:600; letter-spacing:3px;
    cursor:pointer; transition:background .2s, border-color .2s;
    font-family:inherit; text-transform:uppercase;
  }
  .main-btn:active:not(.disabled):not(:disabled) {
    background:linear-gradient(180deg, #4a2a1a, #2a1a10);
  }
  .main-btn:disabled, .main-btn.disabled {
    color:var(--text3) !important;
    border-color:var(--border) !important;
    background:var(--bg2) !important;
    cursor:not-allowed !important;
    pointer-events:none;
  }

  /* === АПГРЕЙДЕР (компактный, всё влезает) === */
  .upgrade-stage {
    flex:1; display:flex; flex-direction:column;
    padding:12px 20px 16px;
    gap:8px; position:relative; z-index:2;
    overflow:hidden;
  }

  .upgrade-pair {
    display:flex; flex-direction:column; gap:8px;
  }

  .upgrade-side {
    border:1px solid var(--border2); border-radius:10px;
    background:linear-gradient(180deg, var(--bg3), var(--bg2));
    padding:10px 12px;
    cursor:pointer;
    display:flex; align-items:center; gap:12px;
    transition:border-color .2s;
  }
  .upgrade-side:active { border-color:var(--accent); }

  .upgrade-side .thumb {
    width:70px; height:44px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    color:var(--text3);
  }
  .upgrade-side .thumb svg { width:100%; height:100%; }

  .upgrade-side .info {
    flex:1; min-width:0;
  }
  .upgrade-side .info .label {
    font-size:9px; color:var(--text3); letter-spacing:2px; text-transform:uppercase;
    margin-bottom:3px;
  }
  .upgrade-side .info .name {
    font-size:13px; color:var(--sand);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .upgrade-side .info .wear {
    font-size:10px; color:var(--text3); margin-top:2px;
  }

  .upgrade-side .price {
    font-size:13px; color:var(--gold2); font-variant-numeric:tabular-nums;
    flex-shrink:0;
  }

  /* Круглый прогресс */
  .upgrade-circle-wrap {
    position:relative; width:150px; height:150px;
    display:flex; align-items:center; justify-content:center;
    margin:4px auto;
  }
  .upgrade-circle {
    width:140px; height:140px; border-radius:50%;
    border:5px solid var(--border);
    background:conic-gradient(var(--gold2) var(--p, 0%), var(--border) 0%);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    transition:background .3s;
  }
  .upgrade-circle::before {
    content:""; position:absolute; inset:7px; border-radius:50%;
    background:var(--bg2); z-index:1;
  }
  .upgrade-percent {
    position:relative; z-index:2;
    font-size:32px; font-weight:200; color:var(--gold2);
    font-variant-numeric:tabular-nums;
  }
  .upgrade-percent span { font-size:18px; }

  .upgrade-arrow-indicator {
    position:absolute; top:-8px; left:50%;
    transform:translateX(-50%) rotate(0deg);
    transform-origin:50% 83px;
    z-index:5;
    filter:drop-shadow(0 0 6px var(--gold2));
  }
  .upgrade-arrow-indicator svg { width:16px; height:22px; }
  .upgrade-arrow-indicator.spinning {
    animation:arrowSpin 3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }
  @keyframes arrowSpin {
    0%   { transform:translateX(-50%) rotate(0deg); }
    100% { transform:translateX(-50%) rotate(1080deg); }
  }

  .upgrade-chance {
    text-align:center; font-size:11px; color:var(--text3);
    letter-spacing:2px;
  }
  .upgrade-chance span { color:var(--accent); font-weight:600; }

  /* Кнопка апгрейда — фиксирована внизу */
  .upgrade-controls {
    margin-top:auto;
    padding-top:8px;
  }

  /* Профиль */
  .profile-content { flex:1; padding:0 20px; overflow-y:auto; position:relative; z-index:2; }
  .profile-card {
    border:1px solid var(--border2); background:linear-gradient(180deg, var(--bg3), var(--bg2));
    border-radius:12px;
    padding:20px; margin-bottom:14px;
    display:flex; align-items:center; gap:14px;
  }
  .profile-avatar {
    width:56px; height:56px; border-radius:50%;
    border:1px solid var(--border2); flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    color:var(--sand); background:var(--bg);
    overflow:hidden;
  }
  .profile-avatar img { width:100%; height:100%; object-fit:cover; }
  .profile-avatar .ico { font-size:26px; }
  .profile-info .name { font-size:16px; font-weight:500; color:var(--sand); }
  .profile-info .username { color:var(--text3); font-size:12px; margin-top:3px; }

  .stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
  .stat-card {
    border:1px solid var(--border); background:linear-gradient(180deg, var(--bg3), var(--bg2));
    border-radius:10px; padding:16px 12px; text-align:center;
  }
  .stat-card .stat-label {
    font-size:9px; color:var(--text3); letter-spacing:2px; text-transform:uppercase;
    margin-bottom:6px;
  }
  .stat-card .stat-value {
    font-size:18px; font-weight:300; color:var(--sand);
    font-variant-numeric:tabular-nums;
  }

  .section-title {
    font-size:9px; color:var(--text3); letter-spacing:4px; text-transform:uppercase;
    margin:18px 0 8px;
  }

  .promo-row { display:flex; gap:8px; }
  .promo-input {
    flex:1; min-width:0; background:var(--bg); border:1px solid var(--border);
    border-radius:8px; padding:14px; color:var(--sand);
    font-size:13px; outline:none; font-family:inherit;
  }
  .promo-input::placeholder { color:var(--text3); }
  .promo-input:focus { border-color:var(--accent); }
  .promo-btn {
    background:linear-gradient(180deg, var(--bg3), var(--bg2)); border:1px solid var(--accent);
    border-radius:8px; padding:0 20px; color:var(--sand);
    font-size:12px; cursor:pointer; font-family:inherit;
    flex-shrink:0;
  }
  .promo-btn:active { background:#4a2a1a; }

  .pay-row { display:flex; gap:10px; margin-bottom:10px; }
  .pay-btn {
    flex:1; min-width:0; background:linear-gradient(180deg, var(--bg3), var(--bg2)); border:1px solid var(--border);
    border-radius:10px; padding:16px 12px; color:var(--sand);
    cursor:pointer; font-family:inherit; font-size:12px;
    display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .pay-btn:active { border-color:var(--accent); }
  .pay-btn .pay-icon { color:var(--gold2); }
  .pay-btn .pay-icon .ico { font-size:24px; }
  .pay-btn .pay-sub { font-size:9px; color:var(--text3); }

  #toast {
    position:fixed; top:50px; left:50%;
    transform:translateX(-50%) translateY(-30px);
    background:var(--bg2); color:var(--sand);
    padding:12px 20px; border-radius:100px;
    font-size:13px; z-index:100;
    border:1px solid var(--accent);
    transition:transform .3s, opacity .3s;
    pointer-events:none; white-space:nowrap; opacity:0;
  }
  #toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
</style>
</head>
<body>

<div id="bg"></div>

<div class="decor-crates">
  <div class="crate"></div>
  <div class="crate small"></div>
  <div class="crate"></div>
  <div class="crate small"></div>
  <div class="crate"></div>
</div>

<!-- МЕНЮ -->
<div class="screen" id="menu">
  <div class="brand">C<span>S</span>2 · DUST 2</div>

  <div class="balance-block">
    <div class="balance-label">Баланс</div>
    <div class="balance-value" id="menuBalance">
      <span class="ico" data-icon="ruble"></span>
      <span class="num">0</span>
    </div>
  </div>

  <div class="modes">
    <button class="mode-btn" onclick="openMode('cases')">
      <div>
        <div class="label">Кейсы</div>
        <div class="sub">Открой контейнер</div>
      </div>
      <div class="arrow">→</div>
    </button>
    <button class="mode-btn" onclick="openMode('upgrade')">
      <div>
        <div class="label">Апгрейдер</div>
        <div class="sub">Обменяй скины</div>
      </div>
      <div class="arrow">→</div>
    </button>
  </div>

  <div class="menu-footer">
    <button class="mini-btn" onclick="openProfile()">Профиль</button>
  </div>
</div>

<!-- КЕЙСЫ -->
<div class="screen hidden" id="cases">
  <div class="topbar">
    <button class="close-btn" onclick="backToMenu()">
      <span class="ico" data-icon="close"></span>
    </button>
    <div class="topbar-balance">
      <span class="ico" data-icon="ruble"></span>
      <span id="casesBalance">0</span>
    </div>
  </div>

  <div class="cases-list">
    <button class="case-item case-sub" onclick="openCaseScreen('subcase')">
      <div class="info">
        <div class="name">Бесплатный кейс</div>
        <div class="range">Пыльные скины · раз в 24ч</div>
      </div>
      <div class="price">
        <span class="ico" data-icon="gift"></span>
        Free
      </div>
    </button>

    <button class="case-item" onclick="openCaseScreen('case10')">
      <div class="info">
        <div class="name">Пыльный контейнер</div>
        <div class="range">Песочные скины · от 1 ₽</div>
      </div>
      <div class="price">
        <span class="ico" data-icon="ruble"></span>
        10
      </div>
    </button>

    <button class="case-item" onclick="openCaseScreen('case50')">
      <div class="info">
        <div class="name">Выжженный контейнер</div>
        <div class="range">Пустынные скины · от 5 ₽</div>
      </div>
      <div class="price">
        <span class="ico" data-icon="ruble"></span>
        50
      </div>
    </button>

    <button class="case-item" onclick="openCaseScreen('case100')">
      <div class="info">
        <div class="name">Золотой контейнер</div>
        <div class="range">Covert скины · от 10 ₽</div>
      </div>
      <div class="price">
        <span class="ico" data-icon="ruble"></span>
        100
      </div>
    </button>
  </div>
</div>

<!-- ОТКРЫТИЕ КЕЙСА -->
<div class="screen hidden" id="caseOpen">
  <div class="topbar">
    <button class="close-btn" onclick="closeCase()">
      <span class="ico" data-icon="close"></span>
    </button>
    <div class="topbar-balance">
      <span class="ico" data-icon="ruble"></span>
      <span id="openBalance">0</span>
    </div>
  </div>

  <div class="roulette-stage">
    <div class="roulette">
      <div class="track" id="track"></div>
      <div class="pointer"></div>
    </div>

    <div class="spin-result" id="spinResult">
      <div class="label">Выпало</div>
      <div class="val" id="spinValue"></div>
    </div>
  </div>

  <div class="spin-controls">
    <button class="main-btn" id="spinBtn" onclick="mainCaseAction()">Открыть</button>
  </div>
</div>

<!-- АПГРЕЙДЕР -->
<div class="screen hidden" id="upgrade">
  <div class="topbar">
    <button class="close-btn" onclick="backToMenu()">
      <span class="ico" data-icon="close"></span>
    </button>
    <div class="topbar-balance">
      <span class="ico" data-icon="ruble"></span>
      <span id="upgradeBalance">0</span>
    </div>
  </div>

  <div class="upgrade-stage">
    <div class="upgrade-pair">
      <div class="upgrade-side" id="upgradeFrom" onclick="pickFromSkin()">
        <div class="thumb" id="upFromPreview"></div>
        <div class="info">
          <div class="label">Твой скин</div>
          <div class="name" id="upFromName">Нажми, чтобы выбрать</div>

function renderIcons(root = document) {
  root.querySelectorAll('.ico[data-icon]').forEach(el => {
    const key = el.dataset.icon;
    if (ICONS[key]) el.innerHTML = ICONS[key];
  });
}

/* ==================== СОСТОЯНИЕ ==================== */
const state = {
  balance: 1000,
  skinsValue: 0,
  currentCase: null,
  isSpinning: false,
  upgrade: { fromSkin: null, toSkin: null, chance: 0 },
};

const $ = id => document.getElementById(id);

/* ==================== ФОН ==================== */
(function makeSand(){
  const box = $('bg');
  for (let i = 0; i < 25; i++) {
    const d = document.createElement('div');
    d.className = 'sand-dot';
    d.style.left = Math.random() * 100 + '%';
    d.style.top = Math.random() * 100 + '%';
    d.style.animationDelay = (Math.random() * 20) + 's';
    box.appendChild(d);
  }
})();

/* ==================== UI ==================== */
function fmt(n) { return Math.floor(n).toLocaleString('ru-RU'); }
function rubIco() { return `<span class="ico" data-icon="ruble">${ICONS.ruble}</span>`; }

function updateBalance() {
  $('menuBalance').innerHTML = `${rubIco()}<span class="num">${fmt(state.balance)}</span>`;
  $('casesBalance').textContent = fmt(state.balance);
  $('openBalance').textContent = fmt(state.balance);
  $('upgradeBalance').textContent = fmt(state.balance);
  $('profileBalance').textContent = fmt(state.balance);
  $('statBalance').textContent = fmt(state.balance);
  $('statSkins').textContent = fmt(state.skinsValue);
}

function toastText(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'show';
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = '', 1800);
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  $(id).classList.remove('hidden');
}

/* ==================== НАВИГАЦИЯ ==================== */
function openMode(mode) {
  if (mode === 'cases') showScreen('cases');
  else if (mode === 'upgrade') {
    showScreen('upgrade');
    updateUpgradeChance();
  }
  updateBalance();
}
function backToMenu() { showScreen('menu'); updateBalance(); }
function closeCase() { showScreen('cases'); updateBalance(); }
function openProfile() {
  const user = tg?.initDataUnsafe?.user;
  const av = $('avatar');
  if (user) {
    $('userName').textContent = [user.first_name, user.last_name].filter(Boolean).join(' ') || 'Без имени';
    $('userUsername').textContent = user.username ? '@' + user.username : '—';
    if (user.photo_url) av.innerHTML = `<img src="${user.photo_url}" alt="">`;
    else av.innerHTML = `<span class="ico">${ICONS.user}</span>`;
  } else {
    av.innerHTML = `<span class="ico">${ICONS.user}</span>`;
  }
  showScreen('profile');
}

/* ==================== ДЕМО-СКИНЫ ==================== */
const DEMO_SKINS = [
  { id: 1,  name: 'AK-47 | Пустынный шторм',    weapon: 'rifle_ak',        rarity: 'common',    wear: 'FT', price: 120 },
  { id: 2,  name: 'M4A4 | Песчаная буря',       weapon: 'rifle_m4',        rarity: 'uncommon',  wear: 'MW', price: 340 },
  { id: 3,  name: 'AWP | Выжженная земля',      weapon: 'sniper_awp',      rarity: 'rare',      wear: 'FT', price: 890 },
  { id: 4,  name: 'Desert Eagle | Пыль',        weapon: 'pistol_deagle',   rarity: 'mythical',  wear: 'FN', price: 1450 },
  { id: 5,  name: 'Karambit | Золото пустыни',  weapon: 'knife_karambit', rarity: 'legendary', wear: 'FN', price: 4200 },
  { id: 6,  name: 'Glock-18 | Обгоревший',      weapon: 'pistol_glock',    rarity: 'uncommon',  wear: 'BS', price: 220 },
  { id: 7,  name: 'AWP | Песчаный вихрь',       weapon: 'sniper_awp',      rarity: 'common',    wear: 'WW', price: 80 },
  { id: 8,  name: 'M4A4 | Закат',               weapon: 'rifle_m4',        rarity: 'rare',      wear: 'FT', price: 720 },
  { id: 9,  name: 'Karambit | Пустынный клинок', weapon: 'knife_karambit', rarity: 'legendary', wear: 'FN', price: 5100 },
  { id: 10, name: 'Glock-18 | Сухой ветер',     weapon: 'pistol_glock',    rarity: 'common',    wear: 'FT', price: 60 },
];

const RARITY_WEIGHTS = {
  common:    50,
  uncommon:  25,
  rare:      15,
  mythical:  7,
  legendary: 2.5,
};

function pickRandomSkin() {
  let total = 0;
  for (const k in RARITY_WEIGHTS) total += RARITY_WEIGHTS[k];
  let r = Math.random() * total;
  for (const k in RARITY_WEIGHTS) {
    r -= RARITY_WEIGHTS[k];
    if (r <= 0) {
      const pool = DEMO_SKINS.filter(s => s.rarity === k);
      if (pool.length) return pool[Math.floor(Math.random() * pool.length)];
    }
  }
  return DEMO_SKINS[0];
}

/* ==================== КЕЙСЫ ==================== */
function openCaseScreen(caseKey) {
  state.currentCase = caseKey;
  showScreen('caseOpen');
  updateBalance();
  $('spinBtn').textContent = 'Открыть';
  $('spinBtn').disabled = false;
  $('spinBtn').classList.remove('disabled');
  $('spinResult').className = 'spin-result';
  fillTrack();
}

function fillTrack() {
  const track = $('track');
  track.innerHTML = '';
  track.style.transition = 'none';
  track.style.transform = 'translateX(0)';
  for (let i = 0; i < 60; i++) {
    const skin = DEMO_SKINS[Math.floor(Math.random() * DEMO_SKINS.length)];
    track.appendChild(makeSlot(skin));
  }
}

function makeSlot(skin) {
  const el = document.createElement('div');
  el.className = 'slot ' + skin.rarity;
  el.innerHTML = `
    <div class="slot-img">${ICONS[skin.weapon] || ICONS.rifle_ak}</div>
    <div class="slot-name">${skin.name.split('|')[0].trim()}</div>
    <div class="slot-wear">${skin.wear}</div>
  `;
  return el;
}

function mainCaseAction() {
  if (state.isSpinning) return;
  state.isSpinning = true;
  
  const btn = $('spinBtn');
  btn.disabled = true;
  btn.classList.add('disabled');
  btn.textContent = 'Крутим...';
  $('spinResult').className = 'spin-result';
  
  const track = $('track');
  const winSkin = pickRandomSkin();
  
  track.innerHTML = '';
  const STOP_INDEX = 50;
  for (let i = 0; i < 60; i++) {
    let skin;
    if (i === STOP_INDEX) skin = winSkin;
    else skin = DEMO_SKINS[Math.floor(Math.random() * DEMO_SKINS.length)];
    track.appendChild(makeSlot(skin));
  }
  
  void track.offsetWidth;
  
  const wrap = track.parentElement;
  const wrapW = wrap.clientWidth;
  const targetSlot = track.children[STOP_INDEX];
  const trackRect = track.getBoundingClientRect();
  const slotRect = targetSlot.getBoundingClientRect();
  const slotCenter = (slotRect.left - trackRect.left) + slotRect.width / 2;
  const targetX = wrapW / 2 - slotCenter;
  
  track.style.transition = 'none';
  track.style.transform = 'translateX(0)';
  void track.offsetWidth;
  
  const duration = 4500;
  track.style.transition = `transform ${duration}ms cubic-bezier(0.12, 0.85, 0.18, 1)`;
  track.style.transform = `translateX(${targetX}px)`;
  
  setTimeout(() => {
    state.isSpinning = false;
    btn.disabled = false;
    btn.classList.remove('disabled');
    btn.textContent = 'Ещё раз';
    $('spinValue').innerHTML = `${rubIco()} ${winSkin.price}`;
    $('spinResult').className = 'spin-result show';
    toastText('Выпал: ' + winSkin.name);
  }, duration + 100);
}

/* ==================== АПГРЕЙДЕР ==================== */
function pickFromSkin() {
  const skin = DEMO_SKINS[Math.floor(Math.random() * DEMO_SKINS.length)];
  state.upgrade.fromSkin = skin;
  $('upFromPreview').innerHTML = ICONS[skin.weapon];
  $('upFromName').textContent = skin.name;
  $('upFromWear').textContent = skin.wear;
  $('upFromPrice').textContent = skin.price + ' ₽';
  updateUpgradeChance();
}

function pickToSkin() {
  const skin = DEMO_SKINS[Math.floor(Math.random() * DEMO_SKINS.length)];
  state.upgrade.toSkin = skin;
  $('upToPreview').innerHTML = ICONS[skin.weapon];
  $('upToName').textContent = skin.name;
  $('upToWear').textContent = skin.wear;
  $('upToPrice').textContent = skin.price + ' ₽';
  updateUpgradeChance();
}

function updateUpgradeChance() {
  const from = state.upgrade.fromSkin;
  const to = state.upgrade.toSkin;
  
  if (!from || !to) {
    state.upgrade.chance = 0;
    $('upChance').textContent = '0%';
    $('upgradePercent').textContent = '?%';
    $('upgradeCircle').style.setProperty('--p', '0%');
    return;
  }
  
  let chance = (from.price / to.price) * 100;
  chance = Math.min(chance, 90);
  chance = Math.max(chance, 1);
  state.upgrade.chance = Math.round(chance);
  
  $('upChance').textContent = state.upgrade.chance + '%';
  $('upgradePercent').innerHTML = state.upgrade.chance + '<span>%</span>';
  $('upgradeCircle').style.setProperty('--p', state.upgrade.chance + '%');
}

function doUpgrade() {
  if (!state.upgrade.fromSkin || !state.upgrade.toSkin) {
    toastText('Выбери оба скина');
    return;
  }
  if (state.isSpinning) return;
  state.isSpinning = true;
  
  const btn = $('upgradeBtn');
  btn.disabled = true;
  btn.classList.add('disabled');
  btn.textContent = 'Крутим...';
  
  const arrow = $('upgradeArrow');
  arrow.classList.remove('spinning');
  void arrow.offsetWidth;
  arrow.classList.add('spinning');
  
  setTimeout(() => {
    state.isSpinning = false;
    arrow.classList.remove('spinning');
    btn.disabled = false;
    btn.classList.remove('disabled');
    btn.textContent = 'Прокачать';
    
    const success = Math.random() * 100 < state.upgrade.chance;
    if (success) {
      toastText('Успех! Получен: ' + state.upgrade.toSkin.name);
      state.skinsValue += state.upgrade.toSkin.price;
    } else {
      toastText('Провал...');
    }
    updateBalance();
  }, 3100);
}

/* ==================== ПРОЧЕЕ ==================== */
function applyPromo() { toastText('Промокод: система скоро будет подключена'); }
function withdrawOpen() { toastText('Вывод: система скоро будет подключена'); }
function openTopupSheet() { toastText('Пополнение: система скоро будет подключена'); }

/* ==================== INIT ==================== */
renderIcons();
updateBalance();
</script>
