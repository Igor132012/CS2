<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CS2 Bet</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    height:100%; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:#1a1510; color:#e8dcc8; user-select:none;
  }

  /* === Палитра Dust 2 === */
  :root {
    --bg:      #1a1510;   /* тёмный песок */
    --bg2:     #241e16;   /* песок темнее */
    --bg3:     #2e261c;   /* песок светлее */
    --border:  #3d3224;   /* граница — выжженное дерево */
    --border2: #5c4d38;   /* граница поярче */
    --sand:    #c4a878;   /* основной песочный */
    --sand2:   #d9c49a;   /* светлый песок */
    --sand3:   #8a7754;   /* тёмный песок */
    --text:    #e8dcc8;   /* основной текст */
    --text2:   #a8987a;   /* текст второй */
    --text3:   #6b5f48;   /* текст третий */
    --accent:  #b8563a;   /* выжженный красный (Terrorist) */
    --accent2: #d46b4a;   /* красный светлее */
    --ct:      #4a6b8a;   /* синий CT */
    --ct2:     #6b8fab;   /* синий светлее */
    --gold:    #c49a3a;   /* золото / Covert */
    --gold2:   #e0b84a;   /* золото светлее */
    --green:   #5a7a4a;   /* зелёный */
  }

  /* === Фон — песчаная текстура === */
  #bg {
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 90% 60% at 50% 0%, rgba(196,168,120,0.08), transparent),
      radial-gradient(ellipse 60% 40% at 20% 100%, rgba(184,86,58,0.06), transparent),
      radial-gradient(ellipse 70% 50% at 85% 50%, rgba(74,107,138,0.05), transparent),
      linear-gradient(180deg, #1a1510 0%, #241e16 100%);
  }
  /* Песчинки */
  .sand-dot {
    position:absolute; width:1px; height:1px; background:var(--sand3); border-radius:50%;
    opacity:.3; animation:sandFloat 20s infinite linear;
  }
  @keyframes sandFloat {
    0%   { transform:translate(0, 0); opacity:0; }
    10%  { opacity:.4; }
    90%  { opacity:.4; }
    100% { transform:translate(30px, -40px); opacity:0; }
  }

  .screen {
    position:fixed; inset:0; display:flex; flex-direction:column;
    z-index:1; transition:opacity .25s; background:transparent;
  }
  .screen.hidden { opacity:0; pointer-events:none; }

  .ico {
    display:inline-block; width:1em; height:1em; vertical-align:-0.12em;
    flex-shrink:0; line-height:1;
  }
  .ico svg { width:100%; height:100%; display:block; }

  /* === Меню === */
  #menu { align-items:center; justify-content:center; padding:28px; text-align:center; }
  .brand {
    font-size:12px; color:var(--text3); letter-spacing:8px; text-transform:uppercase;
    margin-bottom:56px; font-weight:600;
  }
  .brand span { color:var(--accent); }
  .balance-block { margin-bottom:56px; }
  .balance-label {
    font-size:10px; color:var(--text3); letter-spacing:4px; text-transform:uppercase;
    margin-bottom:14px;
  }
  .balance-value {
    font-size:58px; font-weight:200; letter-spacing:-2px;
    color:var(--gold2); font-variant-numeric:tabular-nums;
    display:flex; align-items:center; justify-content:center; gap:10px;
    text-shadow:0 0 40px rgba(196,154,58,0.3);
  }
  .balance-value .ico { font-size:42px; color:var(--gold2); opacity:.9; }

  .modes { display:flex; flex-direction:column; gap:12px; width:100%; max-width:320px; }
  .mode-btn {
    border:1px solid var(--border2); background:linear-gradient(180deg, var(--bg3), var(--bg2));
    border-radius:10px;
    padding:22px 26px; color:var(--text); cursor:pointer;
    display:flex; justify-content:space-between; align-items:center;
    transition:border-color .2s, background .2s, box-shadow .2s;
    font-family:inherit; font-size:15px; letter-spacing:1px;
    position:relative; overflow:hidden;
  }
  .mode-btn::before {
    content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:linear-gradient(180deg, var(--accent), var(--gold));
    opacity:.5;
  }
  .mode-btn:active { border-color:var(--accent); box-shadow:0 0 20px rgba(184,86,58,0.25); }
  .mode-btn .label { font-weight:600; color:var(--sand2); position:relative; }
  .mode-btn .sub { color:var(--text3); font-size:11px; margin-top:4px; letter-spacing:0; position:relative; }
  .mode-btn .arrow { color:var(--text3); font-size:18px; position:relative; }

  .menu-footer { margin-top:44px; display:flex; gap:10px; }
  .mini-btn {
    background:transparent; border:1px solid var(--border); color:var(--text3);
    font-size:12px; letter-spacing:1.5px; cursor:pointer;
    font-family:inherit; padding:12px 22px; border-radius:8px;
    transition:all .2s;
  }
  .mini-btn:active { border-color:var(--border2); color:var(--text2); }

  /* === Топбар === */
  .topbar {
    padding:18px 22px; display:flex; justify-content:space-between; align-items:center;
    border-bottom:1px solid var(--border);
  }
  .close-btn {
    background:transparent; border:none; color:var(--text3);
    cursor:pointer; padding:8px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    transition:color .2s;
  }
  .close-btn:active { color:var(--accent2); }
  .close-btn .ico { font-size:20px; }
  .topbar-balance {
    color:var(--gold2); font-size:15px; font-variant-numeric:tabular-nums;
    display:flex; align-items:center; gap:6px; font-weight:300;
  }
  .topbar-balance .ico { font-size:14px; color:var(--gold2); }

  /* === Кейсы === */
  .cases-list {
    flex:1; padding:20px 22px; display:flex; flex-direction:column;
    gap:12px; overflow-y:auto;
  }
  .case-item {
    border:1px solid var(--border2); background:linear-gradient(180deg, var(--bg3), var(--bg2));
    border-radius:10px;
    padding:20px 22px; color:var(--text); cursor:pointer;
    display:flex; justify-content:space-between; align-items:center;
    transition:border-color .2s, box-shadow .2s; font-family:inherit; text-align:left;
    position:relative; overflow:hidden;
  }
  .case-item::before {
    content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:linear-gradient(180deg, var(--sand), var(--accent));
    opacity:0.6;
  }
  .case-item:active { border-color:var(--accent); box-shadow:0 0 20px rgba(184,86,58,0.2); }
  .case-item .info .name { font-size:15px; letter-spacing:1px; font-weight:600; color:var(--sand2); }
  .case-item .info .range {
    color:var(--text3); font-size:11px; margin-top:5px;
    display:flex; align-items:center; gap:3px;
  }
  .case-item .info .range .ico { font-size:10px; }
  .case-item .price {
    font-size:15px; color:var(--gold2); font-variant-numeric:tabular-nums;
    letter-spacing:1px; display:flex; align-items:center; gap:5px;
    flex-shrink:0;
  }
  .case-item .price .ico { font-size:14px; }
  .case-item.case-sub { border-color:var(--green); }
  .case-item.case-sub::before { background:linear-gradient(180deg, var(--green), var(--gold)); }

  /* === Рулетка === */
  .roulette-stage {
    flex:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    position:relative; overflow:hidden;
  }
  .roulette { position:relative; width:100%; height:140px; overflow:hidden; }
  .roulette::before, .roulette::after {
    content:""; position:absolute; top:0; bottom:0; width:100px; z-index:4;
    pointer-events:none;
  }
  .roulette::before { left:0; background:linear-gradient(to right, var(--bg) 10%, transparent); }
  .roulette::after { right:0; background:linear-gradient(to left, var(--bg) 10%, transparent); }

  .track {
    position:absolute; top:0; left:0; height:100%;
    display:flex; align-items:center; will-change:transform;
  }
  .slot {
    width:110px; height:120px; margin:0 5px; flex-shrink:0;
    border:1px solid var(--border); border-radius:8px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
    font-size:10px; font-weight:400; color:var(--text3);
    background:linear-gradient(180deg, var(--bg3), var(--bg2));
    transition:border-color .3s, color .3s, box-shadow .3s;
    overflow:hidden; padding:8px;
  }
  .slot .slot-img {
    width:70px; height:45px; display:flex; align-items:center; justify-content:center;
    color:var(--text3);
  }
  .slot .slot-img svg { width:100%; height:100%; }
  .slot .slot-name {
    font-size:8px; color:var(--text3); text-align:center;
    line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    max-width:100px;
  }
  .slot .slot-wear {
    font-size:7px; color:var(--text3); opacity:.6;
  }
  /* Редкости CS2 */
  .slot.common    { border-color:#4a3d28; color:#8a7754; }
  .slot.common .slot-img { color:#8a7754; }
  .slot.uncommon  { border-color:var(--ct); color:var(--ct2); }
  .slot.uncommon .slot-img { color:var(--ct2); }
  .slot.rare      { border-color:#7a4a8a; color:#b070c0; }
  .slot.rare .slot-img { color:#b070c0; }
  .slot.mythical  { border-color:var(--accent); color:var(--accent2); }
  .slot.mythical .slot-img { color:var(--accent2); }
  .slot.legendary { border-color:var(--gold); color:var(--gold2); box-shadow:0 0 14px rgba(196,154,58,0.3); }
  .slot.legendary .slot-img { color:var(--gold2); }
  .slot.ancient   { border-color:#c44a3a; color:#e85a3a; box-shadow:0 0 18px rgba(196,74,58,0.4); }
  .slot.ancient .slot-img { color:#e85a3a; }

  .pointer {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:2px; height:150px; background:var(--accent2); z-index:5;
    border-radius:1px;
    box-shadow:0 0 16px var(--accent2);
  }

  .spin-result {
    text-align:center; margin-top:30px;
    opacity:0; transition:opacity .3s;
  }
  .spin-result.show { opacity:1; }
  .spin-result .label {
    font-size:10px; color:var(--text3); letter-spacing:4px; text-transform:uppercase;
    margin-bottom:10px;
  }
  .spin-result .val {
    font-size:40px; font-weight:200; letter-spacing:-1px;
    color:var(--gold2); font-variant-numeric:tabular-nums;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .spin-result .val .ico { font-size:24px; }

  .spin-controls { padding:0 22px 30px; }

  .main-btn {
    width:100%; background:linear-gradient(180deg, var(--bg3), var(--bg2)); border:1px solid var(--accent);
    border-radius:10px; padding:20px; color:var(--sand2);
    font-size:14px; font-weight:600; letter-spacing:3px;
    cursor:pointer; transition:background .2s, border-color .2s, box-shadow .2s;
    font-family:inherit; text-transform:uppercase;
  }
  .main-btn:active:not(.disabled):not(:disabled) {
    background:linear-gradient(180deg, #3a1a10, #2a1008);
    border-color:var(--accent2);
    box-shadow:0 0 20px rgba(184,86,58,0.3);
  }
  .main-btn:disabled,
  .main-btn.disabled {
    color:var(--text3) !important;
    border-color:var(--border) !important;
    background:var(--bg2) !important;
    cursor:not-allowed !important;
    letter-spacing:2px;
    pointer-events:none;
  }
  .main-btn.disabled:active,
  .main-btn:disabled:active {
    background:var(--bg2) !important;
    border-color:var(--border) !important;
  }

  /* === Апгрейдер === */
  .upgrade-stage {
    flex:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:22px;
    gap:16px; overflow-y:auto;
  }
  .upgrade-side {
    width:100%; max-width:340px;
    border:1px solid var(--border2); border-radius:10px;
    background:linear-gradient(180deg, var(--bg3), var(--bg2));
    padding:18px;
    position:relative;
  }
  .upgrade-side .label {
    font-size:9px; color:var(--text3); letter-spacing:3px; text-transform:uppercase;
    margin-bottom:12px;
  }
  .upgrade-side .skin-preview {
    width:100%; height:90px; display:flex; align-items:center; justify-content:center;
    color:var(--text3); margin-bottom:8px;
  }
  .upgrade-side .skin-preview svg { width:110px; height:70px; }
  .upgrade-side .skin-name {
    font-size:13px; color:var(--sand2); text-align:center; margin-bottom:3px;
  }
  .upgrade-side .skin-wear {
    font-size:10px; color:var(--text3); text-align:center;
  }
  .upgrade-arrow {
    font-size:22px; color:var(--accent2);
    animation:upArrow 2s infinite;
  }
  @keyframes upArrow {
    0%,100% { transform:translateY(0); opacity:.6; }
    50%     { transform:translateY(-4px); opacity:1; }
  }
  .upgrade-chance {
    text-align:center; font-size:11px; color:var(--text3);
    letter-spacing:2px; margin:8px 0;
  }
  .upgrade-chance span { color:var(--accent2); font-weight:600; }

  /* === Профиль === */
  .profile-content { flex:1; padding:0 22px; overflow-y:auto; }
  .profile-card {
    border:1px solid var(--border2); background:linear-gradient(180deg, var(--bg3), var(--bg2));
    border-radius:14px;
    padding:24px; margin-bottom:16px;
    display:flex; align-items:center; gap:16px;
  }
  .profile-avatar {
    width:60px; height:60px; border-radius:50%;
    border:1px solid var(--border2); flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    color:var(--sand2); background:var(--bg);
    overflow:hidden;
  }
  .profile-avatar img { width:100%; height:100%; object-fit:cover; }
  .profile-avatar .ico { font-size:28px; }
  .profile-info .name { font-size:17px; font-weight:500; color:var(--sand2); }
  .profile-info .username { color:var(--text3); font-size:13px; margin-top:4px; }

  .stats-grid {
    display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;
  }
  .stat-card {
    border:1px solid var(--border); background:linear-gradient(180deg, var(--bg3), var(--bg2));
    border-radius:10px; padding:18px 14px; text-align:center;
  }
  .stat-card .stat-label {
    font-size:9px; color:var(--text3); letter-spacing:3px; text-transform:uppercase;
    margin-bottom:8px;
  }
  .stat-card .stat-value {
    font-size:20px; font-weight:300; color:var(--sand2);
    font-variant-numeric:tabular-nums;
    display:flex; align-items:center; justify-content:center; gap:4px;
  }
  .stat-card .stat-value .ico { font-size:14px; }

  .section-title {
    font-size:9px; color:var(--text3); letter-spacing:4px; text-transform:uppercase;
    margin:20px 0 10px;
  }

  .promo-row { display:flex; gap:8px; }
  .promo-input {
    flex:1; min-width:0; background:var(--bg); border:1px solid var(--border);
    border-radius:10px; padding:16px; color:var(--sand2);
    font-size:14px; outline:none; font-family:inherit;
    letter-spacing:1px;
  }
  .promo-input::placeholder { color:var(--text3); }
  .promo-input:focus { border-color:var(--accent); }
  .promo-btn {
    background:linear-gradient(180deg, var(--bg3), var(--bg2)); border:1px solid var(--accent);
    border-radius:10px; padding:0 22px; color:var(--sand2);
    font-size:13px; cursor:pointer; font-family:inherit;
    letter-spacing:1.5px; transition:all .2s;
    flex-shrink:0;
  }
  .promo-btn:active { background:#3a1a10; border-color:var(--accent2); }

  .pay-row { display:flex; gap:10px; margin-bottom:10px; }
  .pay-btn {
    flex:1; min-width:0; background:linear-gradient(180deg, var(--bg3), var(--bg2)); border:1px solid var(--border);
    border-radius:14px; padding:18px 14px; color:var(--sand2);
    cursor:pointer; font-family:inherit; font-size:13px;
    letter-spacing:1px; transition:all .2s;
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .pay-btn:active { border-color:var(--accent); }
  .pay-btn .pay-icon { display:flex; align-items:center; justify-content:center; color:var(--gold2); }
  .pay-btn .pay-icon .ico { font-size:26px; }
  .pay-btn .pay-label { font-weight:400; }
  .pay-btn .pay-sub { font-size:10px; color:var(--text3); }

  #toast {
    position:fixed; top:60px; left:50%;
    transform:translateX(-50%) translateY(-40px);
    background:var(--bg2); color:var(--sand2);
    padding:14px 24px; border-radius:100px;
    font-size:14px; z-index:100;
    border:1px solid var(--accent);
    transition:transform .35s cubic-bezier(.34,1.56,.64,1), opacity .35s;
    pointer-events:none; white-space:nowrap; opacity:0;
    letter-spacing:.5px;
    display:flex; align-items:center; gap:6px;
  }
  #toast .ico { font-size:13px; }
  #toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
</style>
</head>
<body>

<div id="bg"></div>

<!-- === ГЛАВНОЕ МЕНЮ === -->
<div class="screen" id="menu">
  <div class="brand">C<span>S</span>2 · DUST 2</div>

  <div class="balance-block">
    <div class="balance-label">Баланс</div>
    <div class="balance-value" id="menuBalance">
      <span class="ico" data-icon="coin"></span>
      <span class="num">0</span>
    </div>
  </div>

  <div class="modes">
    <button class="mode-btn" onclick="openMode('cases')">
      <div>
        <div class="label">Кейсы</div>
        <div class="sub">Открой контейнер</div>
      </div>
      <div class="arrow">→</div>
    </button>
    <button class="mode-btn" onclick="openMode('upgrade')">
      <div>
        <div class="label">Апгрейдер</div>
        <div class="sub">Обменяй скины</div>
      </div>
      <div class="arrow">→</div>
    </button>
  </div>

  <div class="menu-footer">
    <button class="mini-btn" onclick="openProfile()">Профиль</button>
  </div>
</div>

<!-- === КЕЙСЫ === -->
<div class="screen hidden" id="cases">
  <div class="topbar">
    <button class="close-btn" onclick="backToMenu()">
      <span class="ico" data-icon="close"></span>
    </button>
    <div class="topbar-balance">
      <span class="ico" data-icon="coin"></span>
      <span id="casesBalance">0</span>
    </div>
  </div>

  <div class="cases-list">
    <button class="case-item case-sub" onclick="openCaseScreen('subcase')">
      <div class="info">
        <div class="name">Бесплатный кейс</div>
        <div class="range">Пыльные скины · раз в 24ч</div>
      </div>
      <div class="price">
        <span class="ico" data-icon="gift"></span>
        Free
      </div>
    </button>

    <button class="case-item" onclick="openCaseScreen('case10')">
      <div class="info">
        <div class="name">Пыльный контейнер</div>
        <div class="range">Песочные скины · от 1 ★</div>
      </div>
      <div class="price">
        <span class="ico" data-icon="coin"></span>
        10
      </div>
    </button>

    <button class="case-item" onclick="openCaseScreen('case50')">
      <div class="info">
        <div class="name">Выжженный контейнер</div>
        <div class="range">Пустынные скины · от 5 ★</div>
      </div>
      <div class="price">
        <span class="ico" data-icon="coin"></span>
        50
      </div>
    </button>

    <button class="case-item" onclick="openCaseScreen('case100')">
      <div class="info">
        <div class="name">Золотой контейнер</div>
        <div class="range">Covert скины · от 10 ★</div>
      </div>
      <div class="price">
        <span class="ico" data-icon="coin"></span>
        100
      </div>
    </button>
  </div>
</div>

<!-- === ОТКРЫТИЕ КЕЙСА === -->
<div class="screen hidden" id="caseOpen">
  <div class="topbar">
    <button class="close-btn" onclick="closeCase()">
      <span class="ico" data-icon="close"></span>
    </button>
    <div class="topbar-balance">
      <span class="ico" data-icon="coin"></span>
      <span id="openBalance">0</span>
    </div>
  </div>

  <div class="roulette-stage">
    <div class="roulette">
      <div class="track" id="track"></div>
      <div class="pointer"></div>
    </div>

    <div class="spin-result" id="spinResult">
      <div class="label">Выпало</div>
      <div class="val" id="spinValue"></div>
    </div>
  </div>

  <div class="spin-controls">
    <button class="main-btn" id="spinBtn" onclick="mainCaseAction()">Купить</button>
  </div>
</div>

<!-- === АПГРЕЙДЕР === -->
<div class="screen hidden" id="upgrade">
  <div class="topbar">
    <button class="close-btn" onclick="backToMenu()">
      <span class="ico" data-icon="close"></span>
    </button>
    <div class="topbar-balance">
      <span class="ico" data-icon="coin"></span>
      <span id="upgradeBalance">0</span>
    </div>
  </div>

  <div class="upgrade-stage">
    <div class="upgrade-side" id="upgradeFrom">
      <div class="label">Твой скин</div>
      <div class="skin-preview" id="upFromPreview"></div>
      <div class="skin-name" id="upFromName">Нажми, чтобы выбрать</div>
      <div class="skin-wear" id="upFromWear">—</div>
    </div>

    <div class="upgrade-arrow">↓</div>

    <div class="upgrade-side" id="upgradeTo">
      <div class="label">Целевой скин</div>
      <div class="skin-preview" id="upToPreview"></div>
      <div class="skin-name" id="upToName">Нажми, чтобы выбрать</div>
      <div class="skin-wear" id="upToWear">—</div>
    </div>

    <div class="upgrade-chance">
      Шанс успеха: <span id="upChance">0%</span>
    </div>

    <button class="main-btn" onclick="doUpgrade()">Апгрейд</button>
  </div>
</div>

<!-- === ПРОФИЛЬ === -->
<div class="screen hidden" id="profile">
  <div class="topbar">
    <button class="close-btn" onclick="backToMenu()">
      <span class="ico" data-icon="close"></span>
    </button>
    <div class="topbar-balance">
      <span class="ico" data-icon="coin"></span>
      <span id="profileBalance">0</span>
    </div>
  </div>

  <div class="profile-content">
    <div class="profile-card">
      <div class="profile-avatar" id="avatar"></div>
      <div class="profile-info">
        <div class="name" id="userName">Гость</div>
        <div class="username" id="userUsername">@username</div>
      </div>
    </div>

    <div class="section-title">Баланс</div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Доступно</div>
        <div class="stat-value" id="statBalance">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">В скинах</div>
        <div class="stat-value" id="statSkins">0</div>
      </div>
    </div>

    <div class="section-title">Промокод</div>
    <div class="promo-row">
      <input type="text" class="promo-input" id="promoInput" placeholder="ВВЕДИ КОД" maxlength="16">
      <button class="promo-btn" onclick="applyPromo()">ОК</button>
    </div>

    <div class="section-title">Действия</div>
    <div class="pay-row">
      <button class="pay-btn" onclick="withdrawOpen()">
        <span class="pay-icon"><span class="ico" data-icon="coin"></span></span>
        <span class="pay-label">Вывод</span>
        <span class="pay-sub">от 100 ★</span>
      </button>
      <button class="pay-btn" onclick="openTopupSheet()">
        <span class="pay-icon"><span class="ico" data-icon="coin"></span></span>
        <span class="pay-label">Пополнить</span>
        <span class="pay-sub">Telegram Stars</span>
      </button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ==================== TELEGRAM ==================== */
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

/* ==================== SVG ИКОНКИ ==================== */
const ICONS = {
  coin: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 12h6M12 9v6"/>
  </svg>`,
  gift: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="8" width="18" height="13" rx="1"/>
    <path d="M3 12h18M12 8v13"/>
    <path d="M12 8c-2 0-4-1-4-3s2-2 4 3c2-5 4-5 4-3s-2 3-4 3z"/>
  </svg>`,
  user: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21c0-4 4-7 8-7s8 3 8 7"/>
  </svg>`,
  close: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 6 L18 18M18 6 L6 18"/>
  </svg>`,
  // Абстрактные иконки оружия
  rifle: `<svg viewBox="0 0 100 40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 20 L60 20 M60 20 L60 12 M60 20 L60 28 M60 12 L80 12 M60 28 L80 28 M80 12 L80 28 M80 12 L88 12 M80 28 L88 28 M88 12 L88 28 M88 12 L95 16 M88 28 L95 24"/>
    <rect x="30" y="16" width="8" height="8" fill="currentColor" opacity="0.3"/>
  </svg>`,
  pistol: `<svg viewBox="0 0 100 40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 20 L55 20 M55 20 L55 12 M55 20 L55 28 M55 12 L70 12 M55 28 L70 28 M70 12 L70 28 M70 12 L80 12 M70 28 L80 28 M80 12 L80 28 M80 12 L85 16 M85 16 L85 24"/>
    <rect x="30" y="16" width="8" height="8" fill="currentColor" opacity="0.3"/>
  </svg>`,
  sniper: `<svg viewBox="0 0 100 40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 20 L65 20 M65 20 L65 12 M65 20 L65 28 M65 12 L85 12 M65 28 L85 28 M85 12 L85 28 M85 12 L95 16 M95 16 L95 24 M30 12 L30 8 M30 8 L40 8 M40 8 L40 12"/>
    <rect x="35" y="16" width="10" height="8" fill="currentColor" opacity="0.3"/>
  </svg>`,
  knife: `<svg viewBox="0 0 100 40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 20 L70 20 M70 20 L75 15 M70 20 L75 25 M15 20 L20 20 M15 15 L15 25 M70 12 L80 12 M70 28 L80 28"/>
    <path d="M15 20 L70 20" stroke-width="3"/>
  </svg>`,
};

function renderIcons(root = document) {
  root.querySelectorAll('.ico[data-icon]').forEach(el => {
    const key = el.dataset.icon;
    if (ICONS[key]) el.innerHTML = ICONS[key];
  });
}

/* ==================== СОСТОЯНИЕ ==================== */
const state = {
  balance: 0,
  skinsValue: 0,
  currentCase: null,
};

const $ = id => document.getElementById(id);

/* ==================== ФОН — песчинки ==================== */
(function makeSand(){
  const box = $('bg');
  for (let i = 0; i < 30; i++) {
    const d = document.createElement('div');
    d.className = 'sand-dot';
    d.style.left = Math.random() * 100 + '%';
    d.style.top = Math.random() * 100 + '%';
    d.style.animationDelay = (Math.random() * 20) + 's';
    box.appendChild(d);
  }
})();

/* ==================== UI ==================== */
function fmt(n) { return Math.floor(n).toLocaleString('ru-RU'); }

function updateBalance() {
  const h = `<span class="ico" data-icon="coin"></span><span class="num">${fmt(state.balance)}</span>`;
  $('menuBalance').innerHTML = h;
  $('casesBalance').textContent = fmt(state.balance);
  $('openBalance').textContent = fmt(state.balance);
  $('upgradeBalance').textContent = fmt(state.balance);
  $('profileBalance').textContent = fmt(state.balance);
  $('statBalance').textContent = fmt(state.balance);
  $('statSkins').textContent = fmt(state.skinsValue);
}

function toastText(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'show';
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = '', 1800);
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  $(id).classList.remove('hidden');
}

/* ==================== НАВИГАЦИЯ ==================== */
function openMode(mode) {
  if (mode === 'cases') showScreen('cases');
  else if (mode === 'upgrade') showScreen('upgrade');
  updateBalance();
}
function backToMenu() {
  showScreen('menu');
  updateBalance();
}
function closeCase() {
  showScreen('cases');
  updateBalance();
}
function openProfile() {
  const user = tg?.initDataUnsafe?.user;
  const av = $('avatar');
  if (user) {
    $('userName').textContent = [user.first_name, user.last_name].filter(Boolean).join(' ') || 'Без имени';
    $('userUsername').textContent = user.username ? '@' + user.username : '—';
    if (user.photo_url) av.innerHTML = `<img src="${user.photo_url}" alt="">`;
    else av.innerHTML = `<span class="ico">${ICONS.user}</span>`;
  } else {
    av.innerHTML = `<span class="ico">${ICONS.user}</span>`;
  }
  showScreen('profile');
}

/* ==================== ДЕМО-СКИНЫ (заглушки) ==================== */
// В будущем здесь будут данные с сервера.
// Пока — демо-скины с абстрактными иконками оружия.
const DEMO_SKINS = [
  { id: 1,  name: 'AK-47 | Пустынный шторм',    weapon: 'rifle',  rarity: 'common',    wear: 'FT' },
  { id: 2,  name: 'M4A4 | Песчаная буря',       weapon: 'rifle',  rarity: 'uncommon',  wear: 'MW' },
  { id: 3,  name: 'AWP | Выжженная земля',      weapon: 'sniper', rarity: 'rare',      wear: 'FT' },
  { id: 4,  name: 'Desert Eagle | Пыль',        weapon: 'pistol', rarity: 'mythical',  wear: 'FN' },
  { id: 5,  name: 'Karambit | Золото пустыни',  weapon: 'knife',  rarity: 'legendary', wear: 'FN' },
  { id: 6,  name: 'USP-S | Обгоревший',         weapon: 'pistol', rarity: 'uncommon',  wear: 'BS' },
  { id: 7,  name: 'SSG 08 | Песчаный вихрь',    weapon: 'sniper', rarity: 'common',    wear: 'WW' },
  { id: 8,  name: 'M4A1-S | Закат',             weapon: 'rifle',  rarity: 'rare',      wear: 'FT' },
  { id: 9,  name: 'Butterfly | Пустынный клинок', weapon: 'knife', rarity: 'ancient',   wear: 'FN' },
  { id: 10, name: 'Glock-18 | Сухой ветер',     weapon: 'pistol', rarity: 'common',    wear: 'FT' },
];

// Редкости → веса (чем выше, тем реже)
const RARITY_WEIGHTS = {
  common:    50,
  uncommon:  25,
  rare:      15,
  mythical:  7,
  legendary: 2.5,
  ancient:   0.5,
};

// Случайный скин по весам
function pickRandomSkin() {
  let total = 0;
  for (const k in RARITY_WEIGHTS) total += RARITY_WEIGHTS[k];
  let r = Math.random() * total;
  for (const k in RARITY_WEIGHTS) {
    r -= RARITY_WEIGHTS[k];
    if (r <= 0) {
      const pool = DEMO_SKINS.filter(s => s.rarity === k);
      if (pool.length) return pool[Math.floor(Math.random() * pool.length)];
    }
  }
  return DEMO_SKINS[0];
}

/* ==================== КЕЙСЫ (заглушка) ==================== */
function openCaseScreen(caseKey) {
  state.currentCase = caseKey;
  showScreen('caseOpen');
  updateBalance();
  $('spinBtn').textContent = 'Купить за 10 ★';
  startIdleSpin();
}

function startIdleSpin() {
  const track = $('track');
  track.innerHTML = '';
  for (let i = 0; i < 20; i++) {
    const skin = DEMO_SKINS[Math.floor(Math.random() * DEMO_SKINS.length)];
    track.appendChild(makeSlot(skin));
  }
}

function makeSlot(skin) {
  const el = document.createElement('div');
  el.className = 'slot ' + skin.rarity;
  el.innerHTML = `
    <div class="slot-img">${ICONS[skin.weapon] || ICONS.rifle}</div>
    <div class="slot-name">${skin.name.split('|')[0].trim()}</div>
    <div class="slot-wear">${skin.wear}</div>
  `;
  return el;
}

function mainCaseAction() {
  // Демо: показываем один случайный скин
  const win = pickRandomSkin();
  $('spinValue').innerHTML = `<span class="ico" data-icon="gift"></span>`;
  $('spinResult').className = 'spin-result show';
  toastText('Выпал: ' + win.name);
}

/* ==================== АПГРЕЙДЕР (заглушка) ==================== */
function doUpgrade() {
  toastText('Апгрейд: система скоро будет подключена');
}

/* ==================== ПРОЧЕЕ ==================== */
function applyPromo() { toastText('Промокод: система скоро будет подключена'); }
function withdrawOpen() { toastText('Вывод: система скоро будет подключена'); }
function openTopupSheet() { toastText('Пополнение: система скоро будет подключена'); }

/* ==================== INIT ==================== */
renderIcons();
updateBalance();
</script>
</body>
</html>
